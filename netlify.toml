[build]
  command = "npm run build"
  publish = "dist"
[functions]
  directory = "netlify/functions"
[[redirects]]
  from = "/"
  to = "/landing/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200
